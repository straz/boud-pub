history:
  - id: cr-h001
    card_type: capital_at_risk
    title: Agent recruitment spend increase
    exposure: "$300K"
    owner: Priya Nair
    team: Agent Growth
    commitment: >
      Increase agent recruitment spend by $300K in Q1, assuming new agent
      joins will average 50 per month and CAC stays below $6K per agent.
    foreclosed_alternative: >
      Hold recruitment spend flat and focus on retention of existing top-tier
      agents through enhanced commission structures.
    falsifier: >
      If agent joins fall below 35 per month for four consecutive weeks or
      CAC exceeds $6,500, cut incremental recruitment spend immediately.
    outcome: validated
    outcome_summary: >
      52 average monthly joins against a 50-join target. CAC held at $5,800.
      Assumption was correct; commitment honored. Spend continues into Q2.
    lessons: >
      The falsifier threshold was well-calibrated. Setting CAC at $6K vs
      the $6.5K limit gave enough early-warning runway. Use same structure
      for Q2 expansion.
    closed_date: "2026-04-10"
    days_active: 84

  - id: cr-h002
    card_type: capital_at_risk
    title: Mortgage partnership referral assumption
    exposure: "$220K"
    owner: David Lowe
    team: Partnerships
    commitment: >
      Commit to exclusive mortgage referral partnership assuming 200+
      qualified referrals per month within 60 days of launch.
    foreclosed_alternative: >
      Maintain non-exclusive referral arrangement with three providers and
      retain negotiating leverage.
    falsifier: >
      If qualified referrals fall below 80 per month for six consecutive
      weeks, terminate exclusivity and revert to multi-partner model.
    outcome: falsified
    outcome_summary: >
      Referrals peaked at 45 per month — well below the 80-unit falsifier
      threshold. Exclusivity terminated at week 9. Multi-partner model
      reinstated. $220K partnership fee partially recovered.
    lessons: >
      Demand assumptions were based on competitor benchmarks, not our
      own agent referral behavior. Foreclosed alternative was the correct
      path. Smaller pilot before exclusivity would have detected this earlier.
    closed_date: "2026-03-28"
    days_active: 63

  - id: cr-h003
    card_type: stale_commitment
    title: Canadian province expansion timing
    exposure: "$1.1M"
    owner: Amir Shaheen
    team: Expansion
    commitment: >
      Launch operations in two additional Canadian provinces by end of Q2
      2026, assuming regulatory approval timelines of 8–10 weeks.
    foreclosed_alternative: >
      Stage entry to one province in Q2 and defer the second until Q3 once
      regulatory processes are better understood.
    falsifier: >
      If regulatory approval exceeds 14 weeks in the first province, defer
      second province launch and revise the full expansion timeline.
    outcome: revised
    outcome_summary: >
      Regulatory approval in Ontario took 17 weeks, breaching the 14-week
      falsifier. Owner revised commitment: single-province Q3 launch with
      second province deferred to Q4. Budget reallocated accordingly.
    lessons: >
      Regulatory timelines in new markets require a wider falsifier window.
      The staged alternative was the correct structure — it became the revised
      commitment after falsification.
    closed_date: "2026-04-25"
    days_active: 41
