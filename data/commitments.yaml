    recommended_action: >
      Request owner revision within 48 hours before the falsifier threshold
      is breached.
    actions:
      - id: request
        label: Request revision now
        style: primary
      - id: reduce
        label: Reduce confidence
        style: secondary
      - id: ignore
        label: Ignore for now
        style: ghost

