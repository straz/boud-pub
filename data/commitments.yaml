      Delay 6 of 12 planned hires immediately pending conversion recovery
      above 18% for two consecutive weeks.
    commitment: >
      Proceed with all 12 planned Q3 sales hires once enterprise pipeline
      conversion exceeds 18% for two consecutive weeks.
    falsifier: >
      If pipeline conversion stays below 16% through June 30, the hiring
      plan must be revised.
    falsifier_status: approaching
    current_evidence_summary: >
      31 days without revision. High stated confidence combined with no
      update and weakening evidence is historically associated with delayed
