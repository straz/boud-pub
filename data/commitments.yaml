cards:
  - id: cr-001
    card_type: capital_at_risk
    title: Growth spend assumption weakening
    exposure: "$640K"
    owner: Maya Chen
    team: Growth
    stake: "$640K revenue risk this month"
    days_since_review: 9
    evidence:
      - label: CAC
        value: "$224 (↑ $14 vs plan)"
        direction: bad
      - label: D30 Retention
        value: "35%  —  target: 38%"
        direction: bad
      - label: Falsifier status
        value: "Threshold breached yesterday"
        direction: bad
    foreclosed_alternative: >
      Pause paid acquisition until onboarding changes demonstrated
      measurable retention lift.
    commitment: >
      Increase paid acquisition spend by $500K in June, assuming onboarding
      improvements will lift D30 retention above 38% by July 15.
    falsifier: >
      If CAC rises above $210 and D30 retention stays below 38% for 10
      consecutive days, stop incremental spend.
    falsifier_status: triggered
    current_evidence_summary: >
      CAC at $224 against a $210 threshold. D30 retention at 35% against a
      38% target. Falsifier breached yesterday. No owner revision submitted.
    recommended_action: >
      Freeze incremental spend pending a revised growth case from the owner.
    actions:
      - id: freeze
        label: Freeze spend
        style: danger
      - id: ask
        label: Ask for revised forecast
        style: secondary
      - id: override
        label: Override concern
        style: ghost

  - id: cr-002
